<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Stage 1 calibration summary</title><desc id="desc">Expected calibration error before and after Platt scaling and calibration slopes.</desc>
<style>
.bg{fill:#fbfcfe}.h{font:700 24px Arial;fill:#17344c}.sub{font:17px Arial;fill:#455a6b}.lab{font:16px Arial;fill:#253b4c}.small{font:14px Arial;fill:#596d7d}.axis{stroke:#9aabba;stroke-width:1}.raw{fill:#8aa8c4}.cal{fill:#39a779}.line{stroke:#aab6c2;stroke-width:1}
</style>
<rect class="bg" width="1000" height="560"/>
<text x="500" y="38" text-anchor="middle" class="h">Stage 1 calibration summary</text>
<text x="500" y="66" text-anchor="middle" class="sub">ECE (lower is better); slopes shown below for context</text>
<text x="230" y="110" text-anchor="middle" class="lab">Diabetes</text><text x="500" y="110" text-anchor="middle" class="lab">CVD</text><text x="770" y="110" text-anchor="middle" class="lab">Obesity</text>
<line x1="100" y1="405" x2="900" y2="405" class="axis"/>
<line x1="100" y1="135" x2="100" y2="405" class="axis"/>
<text x="78" y="410" text-anchor="end" class="small">0.00</text><text x="78" y="275" text-anchor="end" class="small">0.13</text><text x="78" y="140" text-anchor="end" class="small">0.26</text>
<line x1="100" y1="270" x2="900" y2="270" class="line"/><line x1="100" y1="135" x2="900" y2="135" class="line"/>
<rect x="165" y="160" width="55" height="245" class="raw"/><rect x="225" y="348" width="55" height="57" class="cal"/>
<rect x="435" y="149" width="55" height="256" class="raw"/><rect x="495" y="379" width="55" height="26" class="cal"/>
<rect x="705" y="365" width="55" height="40" class="raw"/><rect x="765" y="349" width="55" height="56" class="cal"/>
<text x="192" y="151" text-anchor="middle" class="small">.235</text><text x="252" y="340" text-anchor="middle" class="small">.054</text>
<text x="462" y="140" text-anchor="middle" class="small">.245</text><text x="522" y="371" text-anchor="middle" class="small">.025</text>
<text x="732" y="357" text-anchor="middle" class="small">.038</text><text x="792" y="341" text-anchor="middle" class="small">.053</text>
<rect x="345" y="435" width="20" height="16" class="raw"/><text x="372" y="449" class="small">Raw</text><rect x="430" y="435" width="20" height="16" class="cal"/><text x="457" y="449" class="small">Platt-calibrated</text>
<text x="500" y="490" text-anchor="middle" class="lab">Calibration slope, raw -> calibrated</text>
<text x="230" y="520" text-anchor="middle" class="small">0.790 -> 0.814</text><text x="500" y="520" text-anchor="middle" class="small">0.823 -> 0.949</text><text x="770" y="520" text-anchor="middle" class="small">0.942 -> 1.061</text>
</svg>